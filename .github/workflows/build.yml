name: build

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q
      - run: python -m sayso.icons sayso\sayso.ico
      - run: pyinstaller --noconfirm --clean sayso.spec
      - name: Build installer
        run: |
          $v = python -c "import sayso; print(sayso.__version__)"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$v installer\sayso.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SaysoSetup
          path: dist/SaysoSetup.exe
      # ---- end-to-end on real Windows: the installed app, real speech, real typing ----
      - name: Versions used in this build
        run: pip freeze
      - name: Make test speech with the Windows voice
        run: python tests/e2e_windows.py --make-wavs e2e_wavs
      - name: Install SaysoSetup.exe silently
        run: |
          $p = Start-Process dist\SaysoSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\Sayso\Sayso.exe")) { throw "Sayso.exe not installed" }
      - name: Self-test the installed app
        timeout-minutes: 15
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\Sayso\Sayso.exe" -ArgumentList '--selftest',"$pwd\selftest_out","$pwd\e2e_wavs" -Wait -PassThru
          Get-Content selftest_out\selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      - name: End-to-end typing test (Notepad)
        timeout-minutes: 20
        run: python tests/e2e_windows.py --run e2e_wavs
      - name: Upgrade over a running copy
        run: |
          Start-Process "$env:LOCALAPPDATA\Programs\Sayso\Sayso.exe"
          Start-Sleep 10
          if (-not (Get-Process Sayso -ErrorAction SilentlyContinue)) { throw "Sayso.exe didn't stay running" }
          $p = Start-Process dist\SaysoSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade failed ($($p.ExitCode))" }
          Get-Process Sayso -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            selftest_out/selftest.json
            selftest_out/profile/Sayso/sayso.log
      - name: Attach installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SaysoSetup.exe
